[package]
name = "internet-downloader"
version = "0.1.0"
edition = "2021"
authors = ["1nternet Downloader Team"]
license = "GPL-3.0-or-later"
default-run = "1idm"

[[bin]]
name = "1idm"
path = "src/main.rs"

[lib]
name = "idm_lib"
path = "src/lib.rs"

[dependencies]
# UI Framework
iced = { version = "0.13", features = ["advanced", "tokio", "canvas", "image", "svg"] }

# Asynchronous Runtime
tokio = { version = "1.42", features = ["full"] }
futures = "0.3"

# Networking
reqwest = { version = "0.12", features = ["stream", "rustls-tls"], default-features = false }
bytes = "1.7"
url = "2.5"
urlencoding = "2.1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialization & System
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
thiserror = "2.0"
anyhow = "1.0"
sha2 = "0.10"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
diesel = { version = "2.4.0", features = ["sqlite"] }

[build-dependencies]
cc = "1.1"

[profile.dev]
debug = false
incremental = false

[profile.test]
debug = false
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security"
] }
