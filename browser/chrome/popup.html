<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internet Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo-box">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      <span class="logo-title">Internet Downloader</span>
    </div>
    <span class="status-badge" id="appStatus">Connected</span>
  </div>

  <div class="content">
    <label for="urlInput" class="input-label">Download URL</label>
    <div class="input-group">
      <input type="text" id="urlInput" placeholder="https://example.com/file.zip" autofocus>
      <button id="pasteBtn" title="Paste from clipboard">📋</button>
    </div>

    <button id="downloadBtn" class="primary-btn">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      Start Download
    </button>

    <div class="divider"></div>

    <div class="toggle-group">
      <label class="toggle-switch">
        <input type="checkbox" id="interceptToggle">
        <span class="slider"></span>
      </label>
      <span class="toggle-label">Capture Browser Downloads</span>
    </div>

    <div class="quick-actions">
      <button id="openAppBtn" class="secondary-btn">Open Desktop App</button>
      <button id="downloadPageMediaBtn" class="secondary-btn">Grab Page Media</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="popup.js"></script>
</body>
</html>
