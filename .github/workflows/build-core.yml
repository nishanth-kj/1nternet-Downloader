name: Build Windows App

on:
  push:
    branches: [main, master, "sprint_*", "feat/**"]
    paths:
      - "core/**"
      - "browser/**"
      - ".github/workflows/build-core.yml"
  pull_request:
    branches: [main, master, "sprint_*"]
    paths:
      - "core/**"
      - "browser/**"
      - ".github/workflows/build-core.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extensions:
    name: Browser extensions (syntax and sync)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check every copy and their drift
        shell: bash
        run: |
          for b in chrome edge brave opera firefox safari; do
            node --check "browser/$b/background.js"
            node --check "browser/$b/popup.js"
            node --check "browser/$b/content.js"
          done
          for b in edge brave opera firefox safari; do
            cmp browser/chrome/popup.js "browser/$b/popup.js"
            cmp browser/chrome/content.js "browser/$b/content.js"
            cmp browser/chrome/popup.html "browser/$b/popup.html"
            cmp browser/chrome/popup.css "browser/$b/popup.css"
            diff <(grep -v '^//' browser/chrome/background.js) <(grep -v '^//' "browser/$b/background.js")
          done

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Export GitHub Actions cache for vcpkg
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ runner.workspace }}/vcpkg
          vcpkgGitCommitId: 94a541197763a4f449a1b91478df48c0584a6256

      # Only libtorrent is needed (core/vcpkg.json). build.rs reads it from
      # core/vcpkg_installed/x64-windows and copies the runtime DLLs.
      - name: Install libtorrent
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT/vcpkg" install `
            --x-manifest-root=core `
            --x-install-root=core/vcpkg_installed `
            --triplet x64-windows

      - name: Build (release)
        working-directory: core
        run: cargo build --release --locked

      - name: Test
        working-directory: core
        run: cargo test --locked

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: 1nternet-Downloader-Windows-x64
          path: |
            core/target/release/1idm.exe
            core/target/release/torrent-rasterbar.dll
            core/target/release/libssl-3-x64.dll
            core/target/release/libcrypto-3-x64.dll
