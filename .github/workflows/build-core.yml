name: Build & Release Core App

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate browser extension JavaScript
        shell: bash
        run: |
          for b in chrome edge brave opera firefox safari; do
            node --check "browser/$b/background.js"
            node --check "browser/$b/popup.js"
          done
          # The copies must not drift: popup.js is identical everywhere, and
          # background.js differs only in browser-specific header comments.
          for b in edge brave opera firefox safari; do
            cmp browser/chrome/popup.js "browser/$b/popup.js"
            diff <(grep -v '^//' browser/chrome/background.js) <(grep -v '^//' "browser/$b/background.js")
          done

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ runner.workspace }}/vcpkg
          vcpkgGitCommitId: 94a541197763a4f449a1b91478df48c0584a6256

      - name: Configure CMake
        run: |
          cmake -S core -B core/build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="${{ runner.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build Application
        run: |
          cmake --build core/build --config Release --parallel

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: InternetDownloader-Windows-x64
          path: |
            core/build/Release/InternetDownloader.exe
            core/build/Release/*.dll

