name: Build Windows App

on:
  push:
    branches: [main, master, "feat/**"]
    paths:
      - "core/**"
      - "browser/**"
      - ".github/workflows/build-core.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "core/**"
      - "browser/**"
      - ".github/workflows/build-core.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate browser extensions
        shell: bash
        run: |
          for b in chrome edge brave opera firefox safari; do
            node --check "browser/$b/background.js"
            node --check "browser/$b/popup.js"
          done
          for b in edge brave opera firefox safari; do
            cmp browser/chrome/popup.js "browser/$b/popup.js"
            diff <(grep -v '^//' browser/chrome/background.js) <(grep -v '^//' "browser/$b/background.js")
          done

      - name: Export GitHub Actions cache for vcpkg
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ runner.workspace }}/vcpkg
          vcpkgGitCommitId: 94a541197763a4f449a1b91478df48c0584a6256

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -S core -B core/out -G "Ninja Multi-Config" `
            -DCMAKE_TOOLCHAIN_FILE="${{ runner.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_INSTALLED_DIR="${{ github.workspace }}/core/vcpkg_installed"

      - name: Build Application
        run: cmake --build core/out --config Release --parallel

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: InternetDownloader-Windows-x64
          path: |
            core/out/Release/InternetDownloader.exe
            core/out/Release/*.dll
