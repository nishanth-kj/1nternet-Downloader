name: Build Android App

on:
  push:
    branches: [main, master, "sprint_*", "feat/**"]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    branches: [main, master, "sprint_*"]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK & CMake
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Export GitHub Actions cache for vcpkg
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ runner.workspace }}/vcpkg
          vcpkgGitCommitId: 94a541197763a4f449a1b91478df48c0584a6256

      - name: Cache vcpkg Android installed tree
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.workspace }}/vcpkg/installed
            ${{ runner.workspace }}/vcpkg/downloads
          key: vcpkg-android-arm64-94a54119-${{ hashFiles('android/vcpkg-triplets/**') }}

      - name: Build libcurl for Android (arm64-v8a, API 24)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          ${{ runner.workspace }}/vcpkg/vcpkg install curl:arm64-android --classic \
            --overlay-triplets=${{ github.workspace }}/android/vcpkg-triplets

      - name: Build Android Release APK
        working-directory: android
        env:
          VCPKG_ROOT: ${{ runner.workspace }}/vcpkg
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: ./gradlew assembleRelease --build-cache --parallel --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: InternetDownloader-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
