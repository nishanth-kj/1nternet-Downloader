name: Feature request
description: Suggest a new feature or an improvement
title: "feat: "
labels: [enhancement]
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - Desktop app (core/)
        - Browser extension (browser/)
        - Android app (android/)
        - Website (site/)
        - Docs / tooling
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The task or problem, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: How it should work, including where it appears in the UI.
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we'll know it works (what to check).
