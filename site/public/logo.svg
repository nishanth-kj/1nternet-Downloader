    <rect x="224" y="150" width="64" height="50" rx="14" opacity="0.75"/>
    <rect x="224" y="216" width="64" height="62" rx="14"/>
    <path d="M152 266h208L256 370z" stroke="#FFFFFF" stroke-width="24" stroke-linejoin="round"/>
    <rect x="132" y="404" width="248" height="36" rx="18"/>
  </g>
