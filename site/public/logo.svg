<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="idr-logo-title">
  <title id="idr-logo-title">Internet Downloader</title>
  <defs>
    <linearGradient id="idr-logo-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2196F3"/>
      <stop offset="1" stop-color="#0D47A1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#idr-logo-bg)"/>
