plugins {
    id 'com.android.application'
}

// The native download engine links libcurl, which is not bundled with the NDK. It's
// pulled from vcpkg's community Android triplets by chainloading the NDK's own CMake
// toolchain through vcpkg's toolchain file (the standard way to combine the two).
// Requires VCPKG_ROOT to be set and a matching NDK version installed locally.
def vcpkgRoot = System.getenv("VCPKG_ROOT")
def ndkHome = System.getenv("ANDROID_NDK_HOME") ?: "${System.getenv("ANDROID_HOME")}/ndk/27.0.12077973"

// Load unified root .version file (single active VERSION, others optional/commented)
def versionProps = new Properties()
def versionFile = file("${rootDir}/../.version")
if (versionFile.exists()) {
    versionFile.withInputStream { versionProps.load(it) }
}
def appVersion = versionProps.getProperty("VERSION") ?: versionProps.getProperty("version") ?: "0.1.0"
def appVersionCode = 1
if (versionProps.getProperty("VERSION_CODE")) {
    appVersionCode = versionProps.getProperty("VERSION_CODE").toInteger()
} else {
    def parts = appVersion.tokenize('.')
    if (parts.size() >= 3) {
        appVersionCode = parts[0].toInteger() * 10000 + parts[1].toInteger() * 100 + parts[2].toInteger()
    } else if (parts.size() == 2) {
        appVersionCode = parts[0].toInteger() * 10000 + parts[1].toInteger() * 100
    }
}

android {
    namespace 'com.nishanth_kj.internetdownloader'
    compileSdk 34
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.nishanth_kj.internetdownloader"
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersion

        // Only arm64-v8a for now: vcpkg's Android community triplets currently cover
        // arm64/arm/x86, but arm64-v8a is the only one this project has been built
        // and verified against. Add other abiFilters entries once their triplet has
        // been proven to build curl + its dependencies successfully.
        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DCMAKE_TOOLCHAIN_FILE=${vcpkgRoot}/scripts/buildsystems/vcpkg.cmake",
                          "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${ndkHome}/build/cmake/android.toolchain.cmake",
                          "-DVCPKG_TARGET_TRIPLET=arm64-android",
                          "-DVCPKG_OVERLAY_TRIPLETS=${projectDir}/../vcpkg-triplets",
                          "-DVCPKG_MANIFEST_MODE=OFF"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.libtorrent4j:libtorrent4j:2.1.0-39'
    implementation 'org.libtorrent4j:libtorrent4j-android-arm64:2.1.0-39'
}
