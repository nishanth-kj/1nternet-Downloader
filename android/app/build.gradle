plugins {
    id 'com.android.application'
}

// The native download engine links libcurl, which is not bundled with the NDK. It's
// pulled from vcpkg's community Android triplets by chainloading the NDK's own CMake
// toolchain through vcpkg's toolchain file (the standard way to combine the two).
// Requires VCPKG_ROOT to be set and a matching NDK version installed locally.
def vcpkgRoot = System.getenv("VCPKG_ROOT")
def ndkHome = System.getenv("ANDROID_NDK_HOME") ?: "${System.getenv("ANDROID_HOME")}/ndk/27.0.12077973"

android {
    namespace 'com.nishanth_kj.internetdownloader'
    compileSdk 34
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.nishanth_kj.internetdownloader"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Only arm64-v8a for now: vcpkg's Android community triplets currently cover
        // arm64/arm/x86, but arm64-v8a is the only one this project has been built
        // and verified against. Add other abiFilters entries once their triplet has
        // been proven to build curl + its dependencies successfully.
        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DCMAKE_TOOLCHAIN_FILE=${vcpkgRoot}/scripts/buildsystems/vcpkg.cmake",
                          "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${ndkHome}/build/cmake/android.toolchain.cmake",
                          "-DVCPKG_TARGET_TRIPLET=arm64-android",
                          "-DVCPKG_OVERLAY_TRIPLETS=${projectDir}/../vcpkg-triplets",
                          "-DVCPKG_MANIFEST_MODE=OFF"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
